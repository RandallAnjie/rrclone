---
# CI for the rrclone fork.
#
# The upstream build.yml only runs in rclone/rclone, so this runs the
# unit tests, a race test of the fork's own packages and lint here. It
# lives in its own file so upstream syncs never conflict with it.

name: rrclone-ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rrclone-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never pick up a real config on the runner
  RCLONE_CONFIG: /notfound
  RRCLONE_CONFIG: /notfound

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '~1.27.3'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

  race:
    name: race (fork packages)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '~1.27.3'
          check-latest: true

      - name: Race tests
        run: |
          go test -race \
            ./lib/accountrotation/... \
            ./lib/oauthutil/... \
            ./lib/rest/... \
            ./fs/config/... \
            ./fs/fshttp/... \
            ./backend/115/... \
            ./backend/box/... \
            ./backend/drive/... \
            ./backend/dropbox/... \
            ./backend/googlephotos/... \
            ./backend/onedrive/...

  lint:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '~1.27.3'
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
